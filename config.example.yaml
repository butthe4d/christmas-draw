# christmas-draw configuration. Copy to config.yaml and edit.

# Used to build links in SMS: <base_url>/p/<token>
base_url: "https://swieta.example.ts.net"

# Required. Must contain {link}; {name} is available. Sent as GSM-7 after
# transliteration (Polish letters lose their accents). Max 2 SMS segments.
greeting: "Hej {name}! W tym roku znow losujemy prezenty. Wpisz swoje zyczenia: {link}"

# Optional; defaults depend on `language`.
# result_template must contain {receiver} and {link}; {name} and {summary} are available.
# result_template: "Wylosowales: {receiver}. Zyczenia: {summary} Pelna lista: {link}"
# reminder_template: "{name}, czekamy na Twoja liste zyczen: {link}"   # needs {link}
# emergency_template: "Zmiana w losowaniu! Dostaniesz nowe."

exclude_couples: true            # default true
lists_editable_after_draw: false
dry_run: true                    # default true: nothing is sent, SMS go to the dry-run log
organiser_phone: "+48600000000"  # optional; receives the SMS test
max_result_segments: 3           # default 3
language: en                     # en | pl; default en. Web UI default and default SMS texts
default_country_code: "+48"      # added to numbers written without a prefix

people:                          # at least 3
  - { name: Maciej, phone: "+48600100200" }
  - { name: Ania,   phone: "600 100 201" }
  - { name: Tomek,  phone: "600-100-202" }
  - { name: Kasia,  phone: "+48600100203" }

couples:                         # not allowed to draw each other (if exclude_couples)
  - [Maciej, Ania]

exclusions:                      # extra forbidden pairs, both directions
  - [Ania, Tomek]

sms:
  provider: gsmservice
  token: "..."                   # or set CHRISTMAS_DRAW_SMS_TOKEN
  sender: ""                     # optional sender name
  server: prod                   # prod | sandbox
  price_per_segment: 0.14        # for cost estimates
  currency: PLN                  # shown next to costs; default PLN
